# Codegen for the collector IPC contract. Run `buf generate` in this directory
# (needs protoc-gen-go + protoc-gen-go-grpc on PATH, i.e. $(go env GOPATH)/bin).
# Generated *.pb.go are checked in so the runtime build stays pure-Go without a
# protoc/buf toolchain — see ADR 0001 (Update 2026-05-21, Transport).
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
