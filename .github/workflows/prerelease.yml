name: prerelease

# Every push to the `release` branch publishes a GitHub *prerelease* carrying
# the same artifacts as a normal release (hashpoint.exe, the MSI installer and
# checksums.txt). It mirrors release.yml's build, but instead of bumping a
# semver tag it derives a SemVer release-candidate version from the latest tag:
#
#   <major>.<minor>.<patch+1>-rc.<x>
#
# i.e. the release candidate for the *next* patch release (release.yml bumps
# patch by default), so per SemVer the rc sorts before that final release.
# `x` is the number of commits since the latest tag — a chronological build
# count that resets when a new tag is cut, giving rc.1, rc.2, … per version.
#
# WiX/VERSIONINFO need a purely numeric version, so the MSI/EXE carry
# <major>.<minor>.<patch+1>.<x> (the -rc.<x> maps to the 4th/revision field).
# MSI only compares the first three fields, so every rc for a given target
# shares <major>.<minor>.<patch+1>; AllowSameVersionUpgrades (see
# build/wix/hashpoint.wxs) lets successive rc MSIs — and the final release —
# replace each other cleanly.
#
# Note: this duplicates release.yml's build steps rather than sharing a
# reusable workflow, to keep the production release pipeline untouched.

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  prerelease:
    name: prerelease
    runs-on: windows-2022
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can find the latest tag and count the
          # commits since it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.2
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Resolve prerelease version
        id: version
        shell: bash
        run: |
          # No pipefail: `git tag | head` would SIGPIPE-fail git under it.
          set -eu
          # Latest semver tag (descending). Default to v0.0.0 when none exist.
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            base="0.0.0"
            range="HEAD"
          else
            base="${latest#v}"
            range="${latest}..HEAD"
          fi
          # Strip any pre-release/build suffix the tag might carry.
          base="${base%%-*}"
          IFS=. read -r maj min pat <<< "$base"
          maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
          next_pat=$((pat + 1))
          # x = commits since the latest tag (this rc series' build count).
          x="$(git rev-list --count "$range")"
          [ "$x" -ge 1 ] || x=1

          semver="${maj}.${min}.${next_pat}-rc.${x}"   # SemVer (tag + display)
          numeric="${maj}.${min}.${next_pat}.${x}"     # WiX/VERSIONINFO (4-part)
          short="$(git rev-parse --short HEAD)"

          {
            echo "semver=${semver}"
            echo "numeric=${numeric}"
            echo "tag=v${semver}"
            echo "short=${short}"
            echo "iso=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Prerelease version: ${semver} (MSI ${numeric})"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Sync winres.json identity.version
        shell: pwsh
        run: |
          # Numeric is already 4-part (major.minor.build.revision); pad just in
          # case a future scheme yields fewer parts.
          $parts = "${{ steps.version.outputs.numeric }}".Split(".")
          while ($parts.Length -lt 4) { $parts += "0" }
          $full = $parts -join "."
          $jsonPath = "winres/winres.json"
          $j = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $j.RT_MANIFEST."#1"."0409".identity.version = $full
          ($j | ConvertTo-Json -Depth 32) | Set-Content -Path $jsonPath -Encoding utf8NoBOM
          Write-Host "Patched winres.json identity.version -> $full"

      - name: Generate Windows resource (.syso)
        shell: bash
        run: |
          go-winres make \
            --in winres/winres.json \
            --arch amd64 \
            --out cmd/timetracker/hashpoint \
            --product-version "${{ steps.version.outputs.numeric }}" \
            --file-version "${{ steps.version.outputs.numeric }}"

      - name: Build Go binary with embedded resources
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p build/bin
          # main.version carries the SemVer string (with -rc.x) for display;
          # the embedded VERSIONINFO carries the numeric form via the .syso.
          go build -trimpath -tags desktop,production \
            -ldflags "-s -w -buildid= -H windowsgui -X main.version=${{ steps.version.outputs.semver }} -X main.commit=${{ github.sha }} -X main.buildDate=${{ steps.version.outputs.iso }}" \
            -o build/bin/hashpoint.exe ./cmd/timetracker

      - name: Locate WiX Toolset 3
        shell: pwsh
        run: |
          function Find-WixBin {
            if ($env:WIX) {
              $p = Join-Path $env:WIX "bin"
              if (Test-Path (Join-Path $p "candle.exe")) { return $p }
            }
            $candidates = Get-ChildItem -Directory "C:\Program Files (x86)" `
              -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue
            foreach ($c in $candidates) {
              $p = Join-Path $c.FullName "bin"
              if (Test-Path (Join-Path $p "candle.exe")) { return $p }
            }
            return $null
          }
          $wixBin = Find-WixBin
          if (-not $wixBin) {
            choco install -y wixtoolset --no-progress
            $wixBin = Find-WixBin
          }
          if (-not $wixBin) {
            Write-Error "WiX 3 candle.exe not found after install attempt."
            exit 1
          }
          Write-Host "Using WiX bin at $wixBin"
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download bundled hashpoint-plugin-manager
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $seedRoot = "build/bin/plugins-seed"
          New-Item -ItemType Directory -Force $seedRoot | Out-Null
          $tmpZip = Join-Path $env:RUNNER_TEMP "plugin-manager.zip"
          gh release download --repo DustHoff/hashpoint-plugin-manager `
            --pattern "plugin-manager_*_windows_amd64.zip" `
            --output $tmpZip --clobber
          Expand-Archive -Path $tmpZip -DestinationPath $seedRoot -Force
          Remove-Item $tmpZip
          $exe = "$seedRoot/plugin-manager/plugin-manager.exe"
          $manifest = "$seedRoot/plugin-manager/manifest.toml"
          if (-not (Test-Path $exe)) {
            Write-Error "plugin-manager.exe nicht im Release-Asset gefunden"
            exit 1
          }
          if (-not (Test-Path $manifest)) {
            Write-Error "manifest.toml nicht im Release-Asset gefunden"
            exit 1
          }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $numeric = "${{ steps.version.outputs.numeric }}"
          $semver  = "${{ steps.version.outputs.semver }}"
          $msiPath = "build/bin/hashpoint-$semver.msi"
          candle.exe -nologo `
            -arch x64 `
            -ext WixUtilExtension `
            -dProductVersion="$numeric" `
            -dExeFile="build/bin/hashpoint.exe" `
            -dIconFile="build/windows/icon.ico" `
            -dSeedPluginManagerExe="build/bin/plugins-seed/plugin-manager/plugin-manager.exe" `
            -dSeedPluginManagerManifest="build/bin/plugins-seed/plugin-manager/manifest.toml" `
            -out "build/bin/hashpoint.wixobj" `
            "build/wix/hashpoint.wxs"
          # ICE57: HKCU under per-machine install (autostart). ICE61: emitted
          # because AllowSameVersionUpgrades is enabled in the .wxs so rc MSIs
          # sharing major.minor.build can upgrade each other. Both accepted.
          light.exe -nologo `
            -spdb `
            -ext WixUtilExtension `
            -sice:ICE57 `
            -sice:ICE61 `
            -out $msiPath `
            "build/bin/hashpoint.wixobj"
          if (-not (Test-Path $msiPath)) {
            Write-Error "MSI build failed: $msiPath not produced"
            exit 1
          }
          Remove-Item "build/bin/hashpoint.wixobj"
          "MSI_NAME=hashpoint-$semver.msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $files = @("hashpoint.exe", "$env:MSI_NAME")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 "build/bin/$f").Hash.ToLower()
            "$hash  $f"
          }
          $lines | Set-Content build/bin/checksums.txt

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Prerelease ${{ steps.version.outputs.semver }} (${{ steps.version.outputs.short }})
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
          files: |
            build/bin/hashpoint.exe
            build/bin/hashpoint-*.msi
            build/bin/checksums.txt
